<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Phishing Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header-icon">🛡️</div>
        <h2>User Login</h2>
        <p class="auth-subtitle">Log in to access AI Phishing Detection tools</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label>Email or Phone Number</label>
                <input type="text" name="identifier" required placeholder="Enter Email or Phone">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn">Login</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign Up here</a></p>
    </div>
</body>
</html>
